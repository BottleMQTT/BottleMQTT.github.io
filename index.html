<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>💡 Включить за 1 ₽</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; gap: 18px;
      padding: 20px; box-sizing: border-box;
      background: #fafafa;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 4px;
      color: #111827;
      text-align: center;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      max-width: 320px;
    }
    #status {
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #374151;
      text-align: center;
      min-width: 200px;
    }
    #status.ok    { background: #dcfce7; color: #14532d; }
    #status.warn  { background: #fef3c7; color: #78350f; }
    #status.err   { background: #fee2e2; color: #7f1d1d; }
    #status.busy  { background: #dbeafe; color: #1e3a8a; }
    button {
      padding: 20px 44px; font-size: 20px; font-weight: 600;
      border: none; border-radius: 16px;
      color: white; cursor: pointer; min-width: 220px;
      background: linear-gradient(180deg, #22c55e, #16a34a);
      box-shadow: 0 4px 12px rgba(34,197,94,0.35);
      transition: transform 0.05s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }
    button:disabled {
      opacity: 0.45; cursor: not-allowed;
      background: #9ca3af; box-shadow: none;
    }
    #log {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      color: #9ca3af;
      max-width: 340px; width: 100%;
      max-height: 140px; overflow-y: auto;
      background: transparent;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>💡 Включить светодиод</h1>
  <div class="subtitle"> 1 ₽ — светодиод горит 3 секунды</div>

  <div id="status">Готово к оплате</div>
  <button id="btn-pay">Оплатить 1 ₽</button>

  <div id="log"></div>

<script>
  // ===== НАСТРОЙКА =====
  // Публичный URL твоего бэкенда (ngrok / cloudflared / боевой домен).
  // При смене URL меняешь только эту строку.
  const API_URL = 'https://ludicrous-trustful-oasis.ngrok-free.dev';

  // Интервал опроса статуса заказа
  const POLL_INTERVAL_MS = 1000;
  const POLL_TIMEOUT_MS  = 60000;   // 60 сек на весь цикл — потом сдаёмся

  // ===== UI =====
  const $status = document.getElementById('status');
  const $btn    = document.getElementById('btn-pay');
  const $log    = document.getElementById('log');

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    $log.textContent = `[${t}] ${msg}\n` + $log.textContent;
    if ($log.textContent.length > 3000) {
      $log.textContent = $log.textContent.slice(0, 3000);
    }
  }

  function setStatus(text, cls) {
    $status.textContent = text;
    $status.className = cls || '';
  }

  function setBusy(busy, label) {
    $btn.disabled = busy;
    if (label) $btn.textContent = label;
    else $btn.textContent = 'Оплатить 1 ₽';
  }

  // Общие заголовки для API (skip ngrok warning)
  const API_HEADERS = {
    'Content-Type': 'application/json',
    'ngrok-skip-browser-warning': 'true',
  };

  // ===== СОЗДАНИЕ ЗАКАЗА =====
  async function createOrder() {
    log('POST /orders');
    const resp = await fetch(API_URL + '/orders', {
      method: 'POST',
      headers: API_HEADERS,
      body: JSON.stringify({ amount_rub: 1 }),
    });
    if (!resp.ok) {
      const t = await resp.text();
      throw new Error('HTTP ' + resp.status + ': ' + t);
    }
    const order = await resp.json();
    log('order ' + order.id + ' — ' + order.status);
    return order;
  }

  // ===== ОПРОС СТАТУСА =====
  async function fetchOrder(id) {
    const resp = await fetch(API_URL + '/orders/' + id, {
      headers: API_HEADERS,
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  }

  // ===== ГЛАВНЫЙ ЦИКЛ =====
  async function pay() {
    setBusy(true, 'Обрабатываем…');
    setStatus('Создаём заказ…', 'busy');

    let order;
    try {
      order = await createOrder();
    } catch (e) {
      log('create error: ' + e.message);
      setStatus('Ошибка: ' + e.message, 'err');
      setBusy(false);
      return;
    }

    // Если у нас реальная ЮKassa — там будет ссылка на страницу оплаты.
    // Для мока — тоже есть URL, но вебхук уже улетел сам, ждать нечего кроме статуса.
    // Открываем оплату в новом окне — это работает и для мока (просто покажется наша заглушка),
    // и для реальной ЮKassa (карточная форма).
    // На проде для мини-приложений MAX может понадобиться другой способ — обсудим отдельно.
    if (order.payment_url) {
      log('payment_url: ' + order.payment_url);
      // Для мока (localhost:8001) окно не открываем — оно недоступно снаружи.
      // Для реальной ЮKassa — откроем.
      if (!order.payment_url.includes('localhost')) {
        window.open(order.payment_url, '_blank');
      }
    }

    setStatus('Ждём подтверждения оплаты…', 'busy');

    // Poll до статуса COMMAND_SENT / COMPLETED / FAILED
    const startedAt = Date.now();
    let last = order;

    while (Date.now() - startedAt < POLL_TIMEOUT_MS) {
      await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));

      try {
        last = await fetchOrder(order.id);
      } catch (e) {
        log('poll error: ' + e.message);
        continue;
      }

      log('status: ' + last.status);

      if (last.status === 'command_sent' || last.status === 'completed') {
        setStatus('✓ Оплачено — светодиод горит!', 'ok');
        setBusy(true, 'Готово');
        // Через 4 секунды снова разрешаем платить
        setTimeout(() => {
          setBusy(false);
          setStatus('Готово к следующей оплате', '');
        }, 4000);
        return;
      }

      if (last.status === 'failed') {
        setStatus('❌ Оплата не прошла', 'err');
        setBusy(false);
        return;
      }
    }

    // Таймаут
    setStatus('⏱ Долго ждём. Проверь оплату в новом окне.', 'warn');
    setBusy(false);
  }

  $btn.addEventListener('click', pay);
  log('ready. API: ' + API_URL);
</script>
</body>
</html>

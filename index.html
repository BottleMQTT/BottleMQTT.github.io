<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пульт ESP32</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; gap: 14px;
      padding: 20px; box-sizing: border-box;
    }
    #status {
      font-size: 15px;
      padding: 8px 14px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #374151;
    }
    #status.ok   { background: #dcfce7; color: #14532d; }
    #status.warn { background: #fef3c7; color: #78350f; }
    #status.err  { background: #fee2e2; color: #7f1d1d; }
    button {
      padding: 18px 36px; font-size: 18px;
      border: none; border-radius: 14px;
      color: white; cursor: pointer; min-width: 180px;
      transition: transform 0.05s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .on  { background: #22c55e; }
    .off { background: #ef4444; }
    #device {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    #log {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #6b7280;
      max-width: 340px; width: 100%;
      max-height: 120px; overflow-y: auto;
      background: #f9fafb;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="status">Подключение…</div>
  <button id="btn-on"  class="on"  disabled>Включить 💡</button>
  <button id="btn-off" class="off" disabled>Выключить</button>
  <div id="device">Устройство: <span id="dev-state">—</span></div>
  <div id="log"></div>

<script>
  // ===== НАСТРОЙКИ =====
  const BROKER_URL   = 'wss://06493d9e7cfd47e8b07315aecba0157d.s1.eu.hivemq.cloud:8884/mqtt';
  const MQTT_USER    = 'max';   // ← сюда логин из HiveMQ Cloud
  const MQTT_PASS    = 'led12345';   // ← сюда пароль

  const DEVICE_ROOT  = 'led-max-mvp/deka552';
  const CMD_TOPIC    = DEVICE_ROOT + '/led/command';
  const STATUS_TOPIC = DEVICE_ROOT + '/led/status';
  const STATUS_WILD  = DEVICE_ROOT + '/#';        // подписываемся на всё поддерево — на всякий случай

  const OFFLINE_MS   = 45000;                     // 45 сек без статуса → офлайн

  // ===== UI =====
  const $status = document.getElementById('status');
  const $btnOn  = document.getElementById('btn-on');
  const $btnOff = document.getElementById('btn-off');
  const $log    = document.getElementById('log');
  const $dev    = document.getElementById('dev-state');

  let lastStatusAt = 0;

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    $log.textContent = `[${t}] ${msg}\n` + $log.textContent;
    if ($log.textContent.length > 3000) {
      $log.textContent = $log.textContent.slice(0, 3000);
    }
  }

  function setStatus(text, cls) {
    $status.textContent = text;
    $status.className = cls || '';
    const online = (cls === 'ok');
    $btnOn.disabled  = !online;
    $btnOff.disabled = !online;
  }

  function setDevice(text, online) {
    $dev.textContent = text;
    $dev.style.color = online ? '#16a34a' : '#dc2626';
    $dev.style.fontWeight = online ? '600' : '400';
  }
  setDevice('—', false);

  // Стабильный Client ID — не плодим сессии в HiveMQ
  let clientId = localStorage.getItem('mqtt_client_id');
  if (!clientId) {
    clientId = 'web-' + Math.random().toString(16).slice(2, 10);
    try { localStorage.setItem('mqtt_client_id', clientId); } catch (e) {}
  }

  const options = {
    clientId: clientId,
    username: MQTT_USER,
    password: MQTT_PASS,
    clean: true,
    keepalive: 20,
    reconnectPeriod: 2000,
    connectTimeout: 10000,
    protocolVersion: 4,
  };

  log('Подключение как ' + clientId);
  const client = mqtt.connect(BROKER_URL, options);

  client.on('connect', () => {
    setStatus('На связи ✓', 'ok');
    log('MQTT connected');
    client.subscribe(STATUS_WILD, { qos: 1 }, (err) => {
      if (err) log('subscribe error: ' + err.message);
      else log('subscribed to ' + STATUS_WILD);
    });
  });

  client.on('reconnect', () => {
    setStatus('Переподключение…', 'warn');
    log('reconnecting…');
  });

  client.on('offline', () => {
    setStatus('Нет связи — жду…', 'warn');
    log('offline');
  });

  client.on('close', () => {
    log('close');
  });

  client.on('error', (e) => {
    setStatus('Ошибка: ' + e.message, 'err');
    log('error: ' + e.message);
  });

  client.on('message', (topic, payload) => {
    const msg = payload.toString();
    log('← ' + topic + ': ' + msg);

    // Обрабатываем всё, что прилетело в статус-топик
    if (topic !== STATUS_TOPIC) return;

    try {
      const j = JSON.parse(msg);

      // LWT-сообщение
      if (j.state === 'offline') {
        setDevice('офлайн', false);
        return;
      }

      // Обычный heartbeat
      if (j.led) {
        lastStatusAt = Date.now();
        const rssi = (typeof j.rssi === 'number') ? ` · RSSI ${j.rssi}` : '';
        const up   = (typeof j.uptime === 'number') ? ` · ${j.uptime}s` : '';
        setDevice(`онлайн · LED ${j.led}${rssi}${up}`, true);
      }
    } catch (e) {
      // Не JSON — просто покажем как есть
      $dev.textContent = msg;
    }
  });

  // Каждые 5 сек проверяем свежесть статуса
  setInterval(() => {
    if (lastStatusAt && Date.now() - lastStatusAt > OFFLINE_MS) {
      setDevice('офлайн (нет heartbeat)', false);
    }
  }, 5000);

  // Отправка с QoS 1 и callback'ом — увидим, ушло ли
  function send(cmd) {
    if (!client.connected) {
      log('cannot send "' + cmd + '" — offline');
      setStatus('Нет связи — команда не ушла', 'err');
      return;
    }
    client.publish(CMD_TOPIC, cmd, { qos: 1 }, (err) => {
      if (err) log('publish error: ' + err.message);
      else log('→ ' + CMD_TOPIC + ': ' + cmd);
    });
  }

  $btnOn.addEventListener('click',  () => send('on'));
  $btnOff.addEventListener('click', () => send('off'));

  // Если MAX/браузер заморозил вкладку и она проснулась — форсируем reconnect
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      log('page visible again');
      if (!client.connected) {
        log('forcing reconnect');
        client.reconnect();
      }
    }
  });
</script>
</body>
</html>
